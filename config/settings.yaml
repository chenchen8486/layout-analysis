# MinerU 与 DeepSeek 全局配置
# 路径支持绝对路径或相对路径（相对于项目根目录）

mineru:
  # MinerU 可执行文件路径；留空时自动按以下优先级查找：
  # 1. conda doc 环境 Scripts/mineru.exe
  # 2. 环境变量 MINERU_PATH
  # 3. 系统 PATH
  executable_path: ""
  backend: "pipeline"
  language: "ch"

deepseek:
  api_key: ""
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  max_retries: 3
  timeout: 60
  # 批量翻译时每次请求的段落数上限
  batch_size: 16

pipeline:
  # 默认输入输出路径；留空时必须在命令行通过 --input / --output 指定。
  # 支持相对路径（相对于项目根目录）或绝对路径。
  input_path: ""
  output_path: ""

logging:
  level: "INFO"
  output_dir: "logs"
